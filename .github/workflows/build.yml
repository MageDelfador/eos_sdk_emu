name: Build Windows (Static Single DLL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pefile
        run: pip install pefile

      - name: Setup vcpkg and install dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/vcpkg'
          triplet: 'x64-windows-static'
          vcpkgArguments: 'install protobuf'
          vcpkgUseCache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          New-Item -ItemType Directory -Path $buildDir | Out-Null

          cmake -S "$env:GITHUB_WORKSPACE" `
                -B $buildDir `
                -G "Ninja" `
                -DCMAKE_BUILD_TYPE=Release `
                -DX64=ON `
                "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
                "-DVCPKG_TARGET_TRIPLET=x64-windows-static"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build"

      - name: Verify DLL imports
        shell: pwsh
        run: |
          $dllPath = "$env:GITHUB_WORKSPACE\build\bin\Release\EOSSDK-Win64-Shipping.dll"
          if (Test-Path $dllPath) {
            python -c "import pefile; pe=pefile.PE(r'$dllPath'); deps=[e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT]; print('IMPORTS:', ', '.join(sorted(deps)))"
          } else {
            Write-Error "DLL not found at $dllPath"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOSSDK-Win64-Shipping
          path: |
            build/bin/Release/EOSSDK-Win64-Shipping.dll
            build/**/*.dll