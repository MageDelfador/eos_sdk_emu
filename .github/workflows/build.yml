name: Build Windows (Static Single DLL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pefile
        run: pip install pefile

      - name: Locate Visual Studio and vcpkg
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -version "[17.0,18.0)" -property installationPath
          if (-not $vsPath) {
            Write-Error "Visual Studio 2022 with C++ tools not found"
            exit 1
          }
          echo "VS_INSTALL_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append

          $vsVcpkgRoot = Join-Path $vsPath "VC\vcpkg"
          echo "VS_VCPKG_ROOT=$vsVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_ROOT=$vsVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$vsVcpkgRoot" | Out-File -FilePath $env:GITHUB_PATH -Append

          Write-Host "Visual Studio 2022 found at: $vsPath"
          Write-Host "VS bundled vcpkg at: $vsVcpkgRoot"

          if (-not (Test-Path (Join-Path $vsVcpkgRoot "vcpkg.exe"))) {
            Write-Host "Bootstrapping vcpkg..."
            & (Join-Path $vsVcpkgRoot "bootstrap-vcpkg.bat")
          } else {
            Write-Host "vcpkg already bootstrapped."
          }

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VS_VCPKG_ROOT }}/installed
          key: ${{ runner.os }}-vsvcpkg-${{ hashFiles('vcpkg.json', '**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vsvcpkg-

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install protobuf static
        shell: pwsh
        run: |
          vcpkg remove protobuf:x64-windows-static --recurse
          vcpkg install protobuf:x64-windows-static
          vcpkg list

      - name: Configure CMake
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          New-Item -ItemType Directory -Path $buildDir | Out-Null

          $protobufDir = "$env:VS_VCPKG_ROOT\installed\x64-windows-static\share\protobuf"
          Write-Host "Protobuf_DIR = $protobufDir"

          cmake -S "$env:GITHUB_WORKSPACE" `
                -B $buildDir `
                -G "Visual Studio 17 2022" `
                -A x64 `
                -DX64=ON `
                -DCMAKE_BUILD_TYPE=Release `
                "-DProtobuf_DIR=$protobufDir"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build" --config Release --clean-first

      - name: Verify DLL imports
        shell: pwsh
        run: |
          $dllPath = "$env:GITHUB_WORKSPACE\build\bin\Release\EOSSDK-Win64-Shipping.dll"
          if (Test-Path $dllPath) {
            python -c "import pefile; pe=pefile.PE(r'$dllPath'); deps=[e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT]; print('IMPORTS:', ', '.join(sorted(deps)))"
          } else {
            Write-Error "DLL not found at $dllPath"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOSSDK-Win64-Shipping
          path: |
            build/bin/Release/EOSSDK-Win64-Shipping.dll
            build/**/*.dll