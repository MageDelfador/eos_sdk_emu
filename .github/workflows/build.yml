name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        build_type: [Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          doNotCache: true
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows-static
          VCPKG_TARGET_TRIPLET: ${{ matrix.arch }}-windows-static
          VCPKG_BINARY_SOURCES: 'clear'

      - name: Patch eos_p2p.h to replace EOS_P2P_PacketQueueInfo with void
        shell: pwsh
        run: |
          $file = "extra/eos_sdk/eos_p2p.h"
          $content = Get-Content $file -Raw
          $content = $content -replace 'EOS_P2P_PacketQueueInfo\s*\*', 'void*'
          Set-Content $file -Value $content
          Write-Host "Patched eos_p2p.h"

      - name: Patch EOS SDK missing types
        shell: pwsh
        run: |
          $header = "extra/eos_sdk/eos_rtc_audio.h"
          if (Test-Path $header) {
            $content = Get-Content $header -Raw
            if ($content -notmatch 'EOS_RTCAudio_RegisterPlatformUserOptions') {
              $typeDef = @"
          EOS_STRUCT(EOS_RTCAudio_RegisterPlatformUserOptions, (
              int32_t ApiVersion;
              const char* PlatformUserId;
          ));
          
          "@
              Add-Content -Path $header -Value "`n$typeDef"
              Write-Host "Added EOS_RTCAudio_RegisterPlatformUserOptions definition to eos_rtc_audio.h"
            } else {
              Write-Host "EOS_RTCAudio_RegisterPlatformUserOptions already defined"
            }
          } else {
            Write-Host "eos_rtc_audio.h not found, skipping patch"
          }

      - name: Regenerate EOS stubs
        shell: pwsh
        run: |
          python tools/generate_eos_stubs.py

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_TARGET_TRIPLET: ${{ matrix.arch }}-windows-static
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows-static
        run: |
          if ("${{ matrix.arch }}" -eq "x64") {
            $arch_flag = "-DX64=ON"
          } else {
            $arch_flag = "-DX86=ON"
          }
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.arch }}-windows-static" `
            $arch_flag `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/**/*.exe
            build/**/*.dll
            build/**/*.lib
          if-no-files-found: warn