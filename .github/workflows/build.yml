name: Build Windows (Static Single DLL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pefile
        run: pip install pefile

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "C:\vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$vcpkgRoot" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-c-${{ hashFiles('vcpkg.json', '**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-c-

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install protobuf static
        shell: pwsh
        run: |
          vcpkg remove protobuf:x64-windows-static --recurse
          vcpkg install protobuf:x64-windows-static
          vcpkg list
          Write-Host "Protobuf config files:"
          Get-ChildItem -Path "C:\vcpkg\installed\x64-windows-static\share\protobuf" -Filter "*config*" -Recurse | Select-Object FullName

      - name: Configure CMake
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          New-Item -ItemType Directory -Path $buildDir | Out-Null

          Write-Host "VCPKG_ROOT = $env:VCPKG_ROOT"
          Write-Host "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"

          cmake -S "$env:GITHUB_WORKSPACE" `
                -B $buildDir `
                -G "Visual Studio 17 2022" `
                -A x64 `
                -DX64=ON `
                -DCMAKE_BUILD_TYPE=Release `
                "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
                "-DVCPKG_TARGET_TRIPLET=x64-windows-static" `
                "-DProtobuf_DIR=$env:VCPKG_ROOT/installed/x64-windows-static/share/protobuf" `
                "-DCMAKE_PREFIX_PATH=$env:VCPKG_ROOT/installed/x64-windows-static"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build" --config Release --clean-first

      - name: Verify DLL imports
        shell: pwsh
        run: |
          $dllPath = "$env:GITHUB_WORKSPACE\build\bin\Release\EOSSDK-Win64-Shipping.dll"
          if (Test-Path $dllPath) {
            python -c "import pefile; pe=pefile.PE(r'$dllPath'); deps=[e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT]; print('IMPORTS:', ', '.join(sorted(deps)))"
          } else {
            Write-Error "DLL not found at $dllPath"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOSSDK-Win64-Shipping
          path: |
            build/bin/Release/EOSSDK-Win64-Shipping.dll
            build/**/*.dll