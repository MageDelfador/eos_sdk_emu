name: Build Windows (Static Single DLL)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pefile
        run: pip install pefile

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "D:\vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$vcpkgRoot" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          $installedDir = "D:\vcpkg\installed\x64-windows-static"
          if (Test-Path $installedDir) {
            Write-Host "Removing old installed directory: $installedDir"
            Remove-Item -Recurse -Force $installedDir
          }
          vcpkg install protobuf:x64-windows-static nlohmann-json:x64-windows-static --recurse --binarysource=clear
          Write-Host "Installed packages:"
          vcpkg list

      - name: Debug vcpkg installation
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT = $env:VCPKG_ROOT"
          Write-Host "Listing D:\vcpkg\installed\x64-windows-static\share:"
          if (Test-Path "D:\vcpkg\installed\x64-windows-static\share") {
            Get-ChildItem "D:\vcpkg\installed\x64-windows-static\share" | Select-Object Name
          } else {
            Write-Host "share directory not found!"
          }

      - name: Configure CMake (Ninja)
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          New-Item -ItemType Directory -Path $buildDir | Out-Null

          cmake -S "$env:GITHUB_WORKSPACE" `
                -B $buildDir `
                -G "Ninja" `
                -DCMAKE_BUILD_TYPE=Release `
                -DX64=ON `
                "-DCMAKE_TOOLCHAIN_FILE=D:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
                "-DVCPKG_TARGET_TRIPLET=x64-windows-static" `
                "-DCMAKE_PREFIX_PATH=D:/vcpkg/installed/x64-windows-static"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build"

      - name: Verify DLL imports
        shell: pwsh
        run: |
          $dllPath = "$env:GITHUB_WORKSPACE\build\bin\Release\EOSSDK-Win64-Shipping.dll"
          if (Test-Path $dllPath) {
            python -c "import pefile; pe=pefile.PE(r'$dllPath'); deps=[e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT]; print('IMPORTS:', ', '.join(sorted(deps)))"
          } else {
            Write-Error "DLL not found at $dllPath"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOSSDK-Win64-Shipping
          path: |
            build/bin/Release/EOSSDK-Win64-Shipping.dll
            build/**/*.dll