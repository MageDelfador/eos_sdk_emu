name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        build_type: [Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          doNotCache: true
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows-static
          VCPKG_TARGET_TRIPLET: ${{ matrix.arch }}-windows-static
          VCPKG_BINARY_SOURCES: 'clear'

      - name: Patch generated stubs to include eos_p2p_types.h
        shell: pwsh
        run: |
          $stub = "eos_dll/eos_missing_stubs.generated.cpp"
          $content = Get-Content $stub -Raw
          if ($content -notmatch '#include "eos_p2p_types.h"') {
            $content = $content -replace '#include "eos_sdk.h"', "#include `"eos_sdk.h`"`n#include `"eos_p2p_types.h`""
            Set-Content $stub -Value $content
            Write-Host "Added explicit include of eos_p2p_types.h"
          } else {
            Write-Host "eos_p2p_types.h already included"
          }

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_TARGET_TRIPLET: ${{ matrix.arch }}-windows-static
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows-static
        run: |
          if ("${{ matrix.arch }}" -eq "x64") {
            $arch_flag = "-DX64=ON"
          } else {
            $arch_flag = "-DX86=ON"
          }
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.arch }}-windows-static" `
            $arch_flag `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/**/*.exe
            build/**/*.dll
            build/**/*.lib
          if-no-files-found: warn